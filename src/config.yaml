site:
  name: Comedor Industrial Geminis
  site: 'https://ComedorIndustrialGeminis.vercel.app'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Comedor Industrial Géminis | Alimentación Empresarial en Puebla y Tlaxcala
    template: '%s — Comedor Industrial Géminis | Alimentación Empresarial en Puebla y Tlaxcala'
  description: "✅ Comedor Industrial Géminis: Más de 30 años ofreciendo alimentación segura, nutritiva y deliciosa en Puebla y Tlaxcala. Banquetes, catering empresarial y comedores industriales para empresas y fábricas."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Comedor Industrial Geminis
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 1600
    type: website
  twitter:
    handle: '@onwidget'
    site: '@onwidget'
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: false

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: false

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
